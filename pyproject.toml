[project]
name = "podpick"
version = "0.1.0"
description = "Targeted suction picks from fabric-pod bins: perception, collateral-aware pick choice, closed-loop extraction"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6", "mujoco>=3.2"]

[project.optional-dependencies]
train = ["torch>=2.3"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "onnxruntime>=1.18"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "onnx>=1.16"]

[project.scripts]
podpick = "podpick.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains models or runs many episodes"]
