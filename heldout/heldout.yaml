notes: >
  A media-and-slim-goods bin of the kind a fulfilment centre fills during the back-to-school or
  holiday book rush: mostly paperbacks and hardbacks, many standing upright with their thin spine
  side to the front, mixed with small flat boxes (games, DVDs, stationery packs) and the odd thin
  polybag (a calendar or a T-shirt). It differs from a generic mixed bin in four ways: books dominate
  the mix instead of being a minority, the bin holds more items (8 to 12), the boxes are small and
  flat rather than full-size, and items crowd the front of the bin where the stower pushed them.
  Tall upright books often stand above the elastic band and present only a narrow spine or a top
  edge, so the robot has to find the flat faces of the boxes and the lying books or pick a book from
  its top, but there are always several cardboard surfaces in reach and nothing is larger than the
  bin allows, so a competent picker should succeed on a good share of these bins.
